<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Successful</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

/* CONTAINER */
.container{
animation:fadeUp 0.8s ease;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:15px;
width:360px;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(56,189,248,0.2);
}

/* SUCCESS ICON */
.success-icon{
width:80px;
height:80px;
border-radius:50%;
background:rgba(34,197,94,0.15);
display:flex;
justify-content:center;
align-items:center;
margin:auto;
margin-bottom:20px;
animation:pop 0.6s ease;
box-shadow:0 0 20px #22c55e;
}

/* CHECKMARK */
.checkmark{
font-size:40px;
color:#22c55e;
animation:scale 0.5s ease;
}

/* TITLE */
.title{
font-size:26px;
margin-bottom:10px;
color:#22c55e;
}

/* TEXT */
.subtitle{
color:#cbd5e1;
margin-bottom:25px;
}

/* BUTTON */
.btn{
padding:14px;
width:100%;
border:none;
border-radius:10px;
background:#38bdf8;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.btn:hover{
background:#0ea5e9;
transform:scale(1.05);
box-shadow:0 0 15px #38bdf8;
}

/* ANIMATIONS */

@keyframes pop{
0%{
transform:scale(0);
}
100%{
transform:scale(1);
}
}

@keyframes scale{
0%{
transform:scale(0);
}
100%{
transform:scale(1);
}
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="success-icon">
<div class="checkmark">✓</div>
</div>

<div class="title">
Payment Successful
</div>

<div class="subtitle">
Your subscription has been activated successfully 🚀
</div>

<button class="btn"
onclick="window.location.href='login.html'">
Back to Login
</button>

</div>

</div>

</body>
</html>
