<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subscription Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
animation:fadeUp 0.8s ease;
}

.card{
background:rgba(255,255,255,0.05);
padding:35px;
border-radius:15px;
width:420px;
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(56,189,248,0.2);
}

.title{
text-align:center;
font-size:22px;
margin-bottom:10px;
}

.plan-name{
text-align:center;
color:#38bdf8;
margin-bottom:20px;
}

.methods{
display:flex;
justify-content:center;
gap:15px;
margin-bottom:20px;
}

.method{
background:white;
color:black;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
transition:.3s;
font-weight:500;
}

.method:hover{
transform:scale(1.1);
box-shadow:0 0 12px #38bdf8;
}

label{
font-size:14px;
color:#cbd5e1;
}

input{
width:100%;
padding:12px;
margin-top:6px;
margin-bottom:15px;
border-radius:8px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
outline:none;
}

.row{
display:flex;
gap:10px;
}

.payment-section{
display:none;
}

.active{
display:block;
}

.qr{
display:flex;
justify-content:center;
margin-top:15px;
}

.qr img{
width:180px;
border-radius:10px;
box-shadow:0 0 15px #38bdf8;
}

.pay-btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#38bdf8;
color:white;
font-size:18px;
cursor:pointer;
}

.pay-btn:hover{
background:#0ea5e9;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="title">
Complete Your Subscription 🚀
</div>

<div class="plan-name" id="planText">
Loading plan...
</div>


<!-- METHODS -->

<div class="methods">

<div class="method" onclick="selectMethod('card')">
💳 Card
</div>

<div class="method" onclick="selectMethod('upi')">
📱 UPI
</div>

<div class="method" onclick="selectMethod('qr')">
💼 QR
</div>

</div>


<!-- CARD -->

<div id="card" class="payment-section">

<label>Card Number</label>
<input type="text">

<div class="row">

<div>
<label>Expiry</label>
<input type="text">
</div>

<div>
<label>CVV</label>
<input type="text">
</div>

</div>

</div>


<!-- UPI -->

<div id="upi" class="payment-section">

<label>Pay to this UPI ID</label>

<input type="text" value="{{ UPI_ID }}" readonly>

<label>Enter Transaction ID</label>

<input type="text" id="transaction_id">

</div>


<!-- QR -->

<div id="qr" class="payment-section">

<div class="qr">

<img src="{{ QR_IMAGE }}">

</div>

<label>Enter Transaction ID</label>

<input type="text" id="transaction_id_qr">

</div>


<button class="pay-btn" onclick="payNow()">
Pay Now
</button>

</div>
</div>


<script>

const params=new URLSearchParams(window.location.search);

const plan=params.get("plan");

document.getElementById("planText").innerText=
plan.toUpperCase()+" Subscription";


let selectedMethod=null;


function selectMethod(method){

selectedMethod=method;

document.querySelectorAll(".payment-section")
.forEach(el=>el.classList.remove("active"));

document.getElementById(method)
.classList.add("active");

}


function payNow(){

if(!selectedMethod){

alert("Select payment method");

return;

}

let transaction="";

if(selectedMethod==="upi"){

transaction=document.getElementById("transaction_id").value;

}

if(selectedMethod==="qr"){

transaction=document.getElementById("transaction_id_qr").value;

}


fetch("/api/create-payment/",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

plan:plan,
method:selectedMethod,
transaction_id:transaction

})

})

.then(res=>res.json())

.then(data=>{

window.location.href="/processing/"+data.payment_id+"/";

});

}

</script>

</body>
</html>
