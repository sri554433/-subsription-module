<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.header{
position:absolute;
top:0;
left:0;
width:100%;
padding:15px 40px;
background:rgba(11,44,61,0.9);
backdrop-filter:blur(10px);
}

.logo{
height:45px;
}

.container{
animation:fadeUp 0.8s ease;
}

.card{
background:rgba(255,255,255,0.05);
padding:35px;
border-radius:15px;
width:380px;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(56,189,248,0.2);
}

.card h2{
margin-bottom:20px;
}

.input-group{
position:relative;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:8px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
outline:none;
font-size:14px;
}

input:focus{
box-shadow:0 0 10px #38bdf8;
}

.eye{
position:absolute;
right:12px;
top:10px;
cursor:pointer;
font-size:18px;
color:#94a3b8;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#38bdf8;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0ea5e9;
transform:scale(1.05);
box-shadow:0 0 15px #38bdf8;
}

.login{
margin-top:15px;
font-size:14px;
}

.login a{
color:#38bdf8;
text-decoration:none;
}

.error{
color:#ef4444;
margin-bottom:10px;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="header">
<img src="/static/logo.png" class="logo">
</div>

<div class="container">

<div class="card">

<h2>Create Account</h2>

{% if error %}
<div class="error">{{ error }}</div>

<script>
alert("{{ error }}");
</script>

{% endif %}

<form method="POST">

{% csrf_token %}

<input type="text"
name="full_name"
placeholder="Full Name"
value="{{ request.POST.full_name }}"
required>

<input type="email"
name="email"
placeholder="Email Address"
value="{{ request.POST.email }}"
required>

<div class="input-group">

<input type="password"
name="password"
id="password"
placeholder="Password"
required>

<span class="eye" onclick="togglePassword('password')">👁</span>

</div>

<div class="input-group">

<input type="password"
name="confirm_password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<span class="eye" onclick="togglePassword('confirmPassword')">👁</span>

</div>

<button type="submit">
Register
</button>

</form>

<div class="login">
Already have account? <a href="/">Login</a>
</div>

</div>

</div>

<script>

function togglePassword(id){

const field=document.getElementById(id);

if(field.type==="password"){
field.type="text";
}else{
field.type="password";
}

}

</script>

</body>
</html>
